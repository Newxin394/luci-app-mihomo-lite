# Mixin: 基础参数/DNS/groups/providers/rules/listeners 恒定覆写; 节点由订阅提供
# 2026-09-20: 基础参数与 DNS 已逐字对齐原 Nikki 生产配置 (/etc/nikki/run/config.yaml)
---
tcp-concurrent: true
unified-delay: true
mode: rule
log-level: warning
ipv6: true
find-process-mode: off
external-ui: ui
external-ui-url: https://github.com/Zephyruso/zashboard/releases/latest/download/dist-cdn-fonts.zip
profile:
  store-selected: true
  store-fake-ip: true

# --- 显式代理入站（Nikki: http 8090 / socks 1080 / mixed 7893 + 鉴权）---
# --- mihomo-lite managed start ---
allow-lan: true
bind-address: "*"
port: 8090
socks-port: 1080
mixed-port: 7893
authentication:
  - "Clash:password"
# --- mihomo-lite managed end ---

# --- DNS：与原 Nikki 生产配置逐字一致（DoH 优先 + 明文引导）---
dns:
  enable: true
  listen: "[::]:1053"
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  default-nameserver:
    - 121.4.4.77
    - 120.53.53.141
    - 2402:4e00:0::57da:bfa2
    - 2402:4e00:1::57da:bfa2
  proxy-server-nameserver:
    - 121.4.4.77
    - 120.53.53.141
    - 2402:4e00:0::57da:bfa2
    - 2402:4e00:1::57da:bfa2
  direct-nameserver:
    - https://doh-57dabfa2.doh.pub/dns-query
    - 121.4.4.77
    - 120.53.53.141
    - 2402:4e00:0::57da:bfa2
    - 2402:4e00:1::57da:bfa2
  nameserver:
    - https://doh-57dabfa2.doh.pub/dns-query
    - 121.4.4.77
    - 120.53.53.141
    - 2402:4e00:0::57da:bfa2
    - 2402:4e00:1::57da:bfa2
  direct-nameserver-follow-policy: false
  nameserver-policy:
    "geosite:private,cn":
      - https://doh-57dabfa2.doh.pub/dns-query
      - 121.4.4.77
      - 120.53.53.141
      - 2402:4e00:0::57da:bfa2
      - 2402:4e00:1::57da:bfa2

