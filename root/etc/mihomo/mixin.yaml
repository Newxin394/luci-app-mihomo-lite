listeners:
  - name: ebpf-in
    type: ebpf
    mode: hybrid
    dns-mode: hijack
    udp-timeout: 300
    bypass-rule-set:
      - ChinaIP
    bypass-private-address: true
    bypass-tun-direct: true
    shared:
      interface:
        - br-lan
      ipv6: true
  - name: srv-hy2
    type: hysteria2
    port: 36712
    listen: 0.0.0.0
    password: 254899c298bee229b4d42a62
    certificate: /etc/mihomo/certs/nikki-hy2.pem
    private-key: /etc/mihomo/certs/nikki-hy2.key
  - name: srv-vless
    type: vless
    port: 8081
    listen: 0.0.0.0
    allow-insecure: true
    users:
      - username: user
        uuid: 24f58611-45d7-4d3b-8fbc-e49f384bbcb5
  - name: srv-vless-ws
    type: vless
    port: 8080
    listen: 0.0.0.0
    ws-path: /
    allow-insecure: true
    users:
      - username: user
        uuid: 24f58611-45d7-4d3b-8fbc-e49f384bbcb5
